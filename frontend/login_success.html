<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Success - Healthcare Platform</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#0ea5e9",
            "primary-hover": "#0284c7",
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        },
      },
    };
  </script>
  <style>
    @keyframes checkmark {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
    .checkmark-animation {
      animation: checkmark 0.6s ease-out;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-green-50 to-emerald-100 dark:from-gray-900 dark:to-gray-800 min-h-screen flex items-center justify-center p-4 font-sans">
  <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl shadow-2xl overflow-hidden border border-gray-200 dark:border-gray-700">
    <div class="bg-gradient-to-r from-emerald-500 to-green-600 h-2"></div>
    
    <div class="p-8 md:p-12 text-center">
      <!-- Success Icon -->
      <div class="mb-6 flex justify-center">
        <div class="w-20 h-20 bg-emerald-100 dark:bg-emerald-900/30 rounded-full flex items-center justify-center checkmark-animation">
          <span class="material-icons text-5xl text-emerald-600 dark:text-emerald-400">check_circle</span>
        </div>
      </div>

      <!-- Success Message -->
      <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-3">Login Successful!</h1>
      <p class="text-gray-600 dark:text-gray-300 mb-8">Welcome back! Redirecting you to your dashboard...</p>

      <!-- Loading Animation -->
      <div class="flex justify-center mb-8">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
      </div>

      <!-- Auto-redirect notice -->
      <p class="text-xs text-gray-500 dark:text-gray-400">
        Redirecting to your dashboard in <span id="countdown">3</span> seconds...
      </p>
    </div>
  </div>

  <script>
    // Get redirect URL from URL parameters or localStorage
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || sessionStorage.getItem('loginRedirect') || 'patient_dashboard.html';
    
    let countdown = 3;
    const countdownElement = document.getElementById('countdown');
    
    const timer = setInterval(() => {
      countdown--;
      if (countdownElement) {
        countdownElement.textContent = countdown;
      }
      
      if (countdown <= 0) {
        clearInterval(timer);
        window.location.href = redirectUrl;
      }
    }, 1000);
  </script>
</body>
</html>
