<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Doctor Dashboard • HealthPortal</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet"/>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#137fec',
            'bg-light': '#f8fafc',
            'bg-dark': '#0f172a',
            'surface-dark': '#1e293b',
          },
          fontFamily: { sans: ['Manrope', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Manrope', system-ui, sans-serif; }
  </style>
</head>

<body class="bg-bg-light dark:bg-bg-dark text-slate-900 dark:text-slate-100 min-h-screen flex">

<!-- Sidebar -->
<aside class="hidden lg:flex lg:flex-col w-72 bg-white dark:bg-[#1a2632] border-r border-slate-200 dark:border-slate-800 h-screen flex-shrink-0 overflow-y-auto">
  <div class="p-6 border-b border-slate-200 dark:border-slate-700">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-full bg-cover bg-center ring-2 ring-primary/20 shadow-sm"
           style="background-image: url('https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=150&h=150&fit=crop');"></div>
      <div class="flex flex-col">
        <h2 class="font-bold text-lg text-slate-900 dark:text-white" id="doctor-name">Loading...</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400" id="doctor-specialization">Loading...</p>
      </div>
    </div>
  </div>

  <nav class="flex-1 px-4 py-6 space-y-1.5">
    <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary/10 text-primary font-semibold">
      <span class="material-symbols-outlined text-primary">dashboard</span>
      <span>Dashboard</span>
    </a>
    <a href="doctor_profile.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors group">
      <span class="material-symbols-outlined text-slate-500 dark:text-slate-400 group-hover:text-primary transition-colors">account_circle</span>
      <span class="font-medium">Profile</span>
    </a>
  </nav>
</aside>

<!-- Main Content -->
<main class="flex-1 lg:ml-72 p-6 lg:p-10">
  <div class="max-w-7xl mx-auto space-y-8">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
      <div>
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white">My Patients</h1>
        <p class="mt-2 text-slate-600 dark:text-slate-400">Overview of all registered patients</p>
      </div>
    </div>

    <!-- Patients Table -->
    <div class="bg-white dark:bg-surface-dark rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead class="bg-slate-50 dark:bg-slate-800/50">
            <tr class="text-xs uppercase tracking-wider text-slate-500 dark:text-slate-400">
              <th class="p-4">Patient Name</th>
              <th class="p-4">Contact</th>
              <th class="p-4">Last Heart Rate</th>
              <th class="p-4">Status</th>
              <th class="p-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="patients-table-body" class="divide-y divide-slate-200 dark:divide-slate-700">
            <tr>
              <td colspan="5" class="p-12 text-center text-slate-500 dark:text-slate-400">
                Loading patients...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- Firebase + Patients List -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
  import { 
    getAuth, 
    onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
  import { 
    getFirestore, 
    collection,
    query,
    where,
    onSnapshot,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBF0omrgmWHRFLdax0lcD_9tMsf5IqV-1o",
    authDomain: "ecg-01-4efa0.firebaseapp.com",
    projectId: "ecg-01-4efa0",
    storageBucket: "ecg-01-4efa0.firebasestorage.app",
    messagingSenderId: "783690911586",
    appId: "1:783690911586:web:e567fbf364f9d4d6d6a63b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      console.warn("No authenticated user → redirecting to login");
      window.location.href = "login.html";
      return;
    }

    console.log("Logged in as:", user.uid, user.email);

    const doctorId = user.uid;

    // ── Load doctor information ───────────────────────────────────────
    const doctorRef = doc(db, "users", doctorId);
    onSnapshot(doctorRef, (snap) => {
      if (snap.exists()) {
        const data = snap.data();
        document.getElementById("doctor-name").textContent = data.fullName || "Dr. Unknown";
        document.getElementById("doctor-specialization").textContent = data.specialization || "Specialist";
        console.log("Doctor loaded:", data.fullName, data.specialization);
      } else {
        console.warn("Doctor document not found in collection 'users'");
        document.getElementById("doctor-name").textContent = "Dr. Unknown";
        document.getElementById("doctor-specialization").textContent = "—";
      }
    }, (err) => {
      console.error("Doctor snapshot error:", err);
    });

    // ── Load all patients ──────────────────────────────────────────────
    const q = query(collection(db, "users"), where("role", "==", "patient"));

    onSnapshot(q, (snapshot) => {
      const tbody = document.getElementById("patients-table-body");
      tbody.innerHTML = "";

      console.log(`Found ${snapshot.size} patient(s)`);

      if (snapshot.empty) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="p-12 text-center text-slate-500 dark:text-slate-400">
              No patients found in the system<br>
              <small>(Make sure some users have <code>role: "patient"</code>)</small>
            </td>
          </tr>`;
        return;
      }

      snapshot.forEach((docSnap) => {
        const p = docSnap.data();

        const row = document.createElement("tr");
        row.className = "hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors";
        row.innerHTML = `
          <td class="p-4 font-medium">${p.fullName || "Unknown Patient"}</td>
          <td class="p-4 text-slate-600 dark:text-slate-300">${p.contact || "—"}</td>
          <td class="p-4 text-slate-600 dark:text-slate-300">— BPM</td>
          <td class="p-4">
            <span class="px-3 py-1 text-xs rounded-full bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300">
              Active
            </span>
          </td>
          <td class="p-4 text-right">
            <button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }, (error) => {
      console.error("Patients query failed:", error.code, error.message);
      document.getElementById("patients-table-body").innerHTML = `
        <tr>
          <td colspan="5" class="p-12 text-center text-red-600 dark:text-red-400">
            Error loading patients<br>
            <small>${error.message}</small><br>
            <small>Check browser console (F12) and Firestore security rules</small>
          </td>
        </tr>`;
    });
  });
</script>

</body>
</html>
