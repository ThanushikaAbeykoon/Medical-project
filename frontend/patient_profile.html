<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile • HealthPortal</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#137fec',
            'bg-light': '#f8fafc',
            'bg-dark': '#0f172a',
            'surface-dark': '#1e293b',
          },
          fontFamily: { sans: ['Manrope', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Manrope', system-ui, sans-serif;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>

<body class="bg-bg-light dark:bg-bg-dark text-slate-900 dark:text-slate-100 min-h-screen flex">

  <!-- Patient Sidebar -->
  <aside
    class="hidden lg:flex lg:flex-col w-72 bg-white dark:bg-[#1a2632] border-r border-slate-200 dark:border-slate-800 h-screen flex-shrink-0 overflow-y-auto">
    <div class="p-6 border-b border-slate-200 dark:border-slate-700">
      <div class="flex items-center gap-3">
        <div id="patient-avatar"
          class="w-12 h-12 rounded-full bg-primary/10 text-primary flex items-center justify-center font-bold text-xl ring-2 ring-primary/20 shadow-sm">
          <!-- Initials -->
        </div>
        <div class="flex flex-col">
          <h2 class="font-bold text-lg text-slate-900 dark:text-white" id="patient-name">Loading...</h2>
          <p class="text-xs text-slate-500 dark:text-slate-400">Patient</p>
        </div>
      </div>
    </div>

    <nav class="flex-1 px-4 py-6 space-y-1.5">
      <a href="patient_dashboard.html"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors group">
        <span
          class="material-symbols-outlined text-slate-500 dark:text-slate-400 group-hover:text-primary transition-colors">dashboard</span>
        <span class="font-medium">Dashboard</span>
      </a>
      <a href="patient_doctors.html"
        class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary/10 text-primary font-semibold">
        <span class="material-symbols-outlined text-primary">group</span>
        <span>My Doctors</span>
      </a>
      <a href="patient_reports.html"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors group">
        <span
          class="material-symbols-outlined text-slate-500 dark:text-slate-400 group-hover:text-primary transition-colors">description</span>
        <span class="font-medium">Medical Reports</span>
      </a>
      <a href="#"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors group">
        <span
          class="material-symbols-outlined text-slate-500 dark:text-slate-400 group-hover:text-primary transition-colors">chat</span>
        <span class="font-medium">Messages</span>
      </a>
      <a href="patient_profile.html"
        class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary/10 text-primary font-semibold">
        <span class="material-symbols-outlined text-primary">account_circle</span>
        <span>Profile</span>
      </a>
    </nav>

    <div class="p-4 border-t border-slate-200 dark:border-slate-800">
      <button id="logout-btn"
        class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/10 transition-colors">
        <span class="material-symbols-outlined">logout</span>
        <span class="font-medium">Log Out</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto p-6 lg:p-10">
    <div class="max-w-5xl mx-auto px-4 sm:px-8 py-8 md:py-10">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-8">
        <div>
          <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white mb-2">Profile
            Management</h1>
          <p class="text-slate-600 dark:text-slate-400">View and update your personal information</p>
        </div>
        <button id="save-btn"
          class="flex items-center gap-2 px-6 py-3 bg-primary text-white rounded-xl font-medium shadow-md hover:bg-blue-600 transition">
          <span class="material-symbols-outlined">save</span>
          Save Changes
        </button>
      </div>

      <div id="profile-loading" class="text-center py-20 text-slate-500 dark:text-slate-400">
        Loading profile...
      </div>

      <div id="profile-content" class="hidden grid gap-8">
        <!-- Profile Header -->
        <div
          class="bg-white dark:bg-surface-dark rounded-2xl border border-slate-200 dark:border-slate-700 p-6 md:p-8 shadow-sm">
          <div class="flex flex-col md:flex-row items-center gap-8">
            <div class="relative group">
              <div id="profile-avatar"
                class="w-32 h-32 md:w-40 md:h-40 rounded-full bg-primary/10 text-primary flex items-center justify-center font-bold text-6xl border-4 border-slate-100 dark:border-slate-700 shadow-inner">
                <!-- Initials -->
              </div>
            </div>
            <div class="flex-1 text-center md:text-left">
              <h2 class="text-3xl font-bold text-slate-900 dark:text-white mb-1" id="profile-name">Loading...</h2>
              <p class="text-slate-500 dark:text-slate-400 mb-4">Patient</p>
            </div>
          </div>
        </div>

        <!-- Personal Information -->
        <section
          class="bg-white dark:bg-surface-dark rounded-2xl border border-slate-200 dark:border-slate-700 p-6 md:p-8 shadow-sm">
          <h3 class="text-xl font-bold mb-6 flex items-center gap-3">
            <span class="material-symbols-outlined text-primary text-2xl">badge</span>
            Personal Information
          </h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Full Name</label>
              <input type="text" id="full-name-input"
                class="w-full px-4 py-2 bg-slate-50 dark:bg-[#1a2632] border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white focus:ring-2 focus:ring-primary outline-none transition"
                placeholder="Full Name">
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Date of Birth</label>
              <input type="date" id="dob-input"
                class="w-full px-4 py-2 bg-slate-50 dark:bg-[#1a2632] border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white focus:ring-2 focus:ring-primary outline-none transition">
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Email</label>
              <input type="email" id="email-input"
                class="w-full px-4 py-2 bg-slate-50 dark:bg-[#1a2632] border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white focus:ring-2 focus:ring-primary outline-none transition"
                placeholder="Email Address">
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Phone</label>
              <input type="tel" id="contact-input"
                class="w-full px-4 py-2 bg-slate-50 dark:bg-[#1a2632] border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white focus:ring-2 focus:ring-primary outline-none transition"
                placeholder="Phone Number">
            </div>
          </div>
        </section>

        <!-- Emergency Contact -->
        <section
          class="bg-white dark:bg-surface-dark rounded-2xl border border-slate-200 dark:border-slate-700 p-6 md:p-8 shadow-sm">
          <h3 class="text-xl font-bold mb-6 flex items-center gap-3">
            <span class="material-symbols-outlined text-primary text-2xl">emergency_home</span>
            Emergency Contact
          </h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Contact Name &
                Phone</label>
              <input type="text" id="emergency-input"
                class="w-full px-4 py-2 bg-slate-50 dark:bg-[#1a2632] border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white focus:ring-2 focus:ring-primary outline-none transition"
                placeholder="Emergency Contact Name & Phone">
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- Firebase + Profile Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBF0omrgmWHRFLdax0lcD_9tMsf5IqV-1o",
      authDomain: "ecg-01-4efa0.firebaseapp.com",
      projectId: "ecg-01-4efa0",
      storageBucket: "ecg-01-4efa0.firebasestorage.app",
      messagingSenderId: "783690911586",
      appId: "1:783690911586:web:e567fbf364f9d4d6d6a63b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      // Load profile data
      onSnapshot(doc(db, "users", user.uid), (docSnap) => {
        document.getElementById("profile-loading").classList.add("hidden");
        document.getElementById("profile-content").classList.remove("hidden");

        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById("patient-name").textContent = data.fullName || "Patient";
          document.getElementById("profile-name").textContent = data.fullName || "Patient";

          // Populate inputs
          document.getElementById("full-name-input").value = data.fullName || "";
          document.getElementById("dob-input").value = data.dob || "";
          document.getElementById("email-input").value = data.email || "";
          document.getElementById("contact-input").value = data.contact || "";
          document.getElementById("emergency-input").value = data.emergencyContact || "";

          // Set Initials
          const name = data.fullName || "Patient";
          const initial = name.charAt(0).toUpperCase();
          document.getElementById("patient-avatar").textContent = initial;
          document.getElementById("profile-avatar").textContent = initial;
        }
      });

      // Save changes
      document.getElementById("save-btn").addEventListener("click", async () => {
        const btn = document.getElementById("save-btn");
        const originalText = btn.innerHTML;
        btn.textContent = "Saving...";
        btn.disabled = true;

        try {
          await updateDoc(doc(db, "users", user.uid), {
            fullName: document.getElementById("full-name-input").value,
            dob: document.getElementById("dob-input").value,
            email: document.getElementById("email-input").value,
            contact: document.getElementById("contact-input").value,
            emergencyContact: document.getElementById("emergency-input").value
          });
          alert("Profile updated successfully!");
        } catch (error) {
          console.error("Error updating profile:", error);
          alert("Failed to update profile.");
        } finally {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }
      });
    });

    // Logout
    document.getElementById("logout-btn").addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.href = "login.html";
      } catch (error) {
        console.error("Logout error:", error);
        alert("Logout failed. Please try again.");
      }
    });
  </script>

</body>

</html>
